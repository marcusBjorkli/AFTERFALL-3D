name: AFTERFALL Cloud Diagnostics
on:
  push:
    branches: [construction-integration]
    paths:
      - 'terrain-integration/**'
      - 'diagnostics/cloud/**'
      - '.github/workflows/afterfall-cloud-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: afterfall-cloud-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cam-001:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.1
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46058891730
          name: CAM-001-46058891730-1
          path: baseline-381
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46070655479
          name: CAM-001-46070655479-1
          path: baseline-394
      - name: CAM-001
        run: node diagnostics/cloud/camera-test.cjs
      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAM-001-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-output/
          retention-days: 30
          if-no-files-found: warn
