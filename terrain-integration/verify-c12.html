<!doctype html><html lang="no"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AFTERFALL CE 1.1.4C.1.3 – eldre plasseringskontroller oppdatert</title><style>body{background:#10231d;color:#edf4ed;font:16px system-ui;max-width:820px;margin:0 auto;padding:20px}section{background:#20392d;border:1px solid #83aa90;border-radius:14px;padding:16px}.good{color:#a5f0bc}.bad{color:#ffb2a9}pre{white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace}a{color:#9de1b2}</style></head><body><h1>CE 1.1.4C.1.2 – småbygg</h1><p>Test av flatt terreng, kollisjoner og rotasjon. Regel om prosjekt-ID er erstattet i C.1.3. Testene berører ikke spillagringen.</p><section><strong id="summary">Kjører tester …</strong><pre id="results"></pre></section><p><a href="./?v=114c12">Tilbake til spillet</a></p><script type="module">
import {SURVIVAL_DEFS,buildSurvival,restoreSurvival} from './survival-structures-114c1.js';
import {normalizeSmallAngle,rotateSmallAngle,validateSmallGround} from './survival-placement-114c12.js';
const checks=[],test=(name,fn)=>{try{if(!fn())throw Error('Uventet resultat');checks.push({name,ok:true})}catch(e){checks.push({name,ok:false,error:String(e)})}};
const q={id:'grade-1',status:'completed',x0:10,x1:16,z0:10,z1:16,level:2},pos={x:13,z:13,y:2,angle:0};
const cfg={heightAt:()=>2,restricted:()=>false,waterAt:()=>false,collides:()=>false,player:{x:3,z:3},other:[],sawbucks:[],piles:[],pileRadius:()=>.3};
const check=(type,p=pos,plans=[q],e=cfg)=>validateSmallGround(type,p,plans,SURVIVAL_DEFS,e);
for(const type of Object.keys(SURVIVAL_DEFS))test('Godkjent terreng: '+SURVIVAL_DEFS[type].name,()=>!check(type).error);
test('Godkjent arkivert terreng',()=>!check('campfire',pos,[{...q,status:'archived'}]).error);
test('Flatt terreng uten registrert planering er godkjent',()=>!check('campfire',pos,[]).error);
test('Pågående planering avvises',()=>!!check('campfire',pos,[{...q,status:'active'}]).error);
test('Flatt terreng på eldre byggeplass gjenbrukes',()=>!check('woodshed',{...pos,x:10.5}).error);
test('Feil kote avvises',()=>!!check('crate',{...pos,y:2.1}).error);
test('Ujevn overflate avvises',()=>!!check('crate',pos,[q],{...cfg,heightAt:(x,z)=>x>13.4?2.1:2}).error);
test('Beskyttet terreng avvises',()=>!!check('campfire',pos,[q],{...cfg,restricted:(x,z)=>z>13.4}).error);
test('Vann avvises',()=>!!check('campfire',pos,[q],{...cfg,waterAt:()=>true}).error);
test('Kollisjon med vegg avvises',()=>!!check('workbench',pos,[q],{...cfg,collides:()=>true}).error);
test('Kollisjon med Marcus avvises',()=>!!check('crate',pos,[q],{...cfg,player:{x:13,z:13}}).error);
test('Andre småbygg blokkerer',()=>!!check('crate',pos,[q],{...cfg,other:[{type:'campfire',x:13,z:13}]}).error);
test('Eldre sagbukk blokkerer',()=>!!check('crate',pos,[q],{...cfg,sawbucks:[{x:13,z:13}]}).error);
test('Materialhaug blokkerer',()=>!!check('crate',pos,[q],{...cfg,piles:[{x:13,z:13}]}).error);
test('Rotasjon +15° og omløp',()=>rotateSmallAngle(350,1)===5);
test('Rotasjon −15° og omløp',()=>rotateSmallAngle(5,-1)===350);
test('Rotasjon fininnstilling 5°',()=>normalizeSmallAngle(93)===95);
test('Fullt omløp tilsvarer 0°',()=>normalizeSmallAngle(720)===0);
const c={stone:{unit:'L',mass:2.65,volume:.001},firewood:{unit:'stk',mass:4.0625,volume:.0075}};
const inv={stone:12,firewood:1};
const saved=buildSurvival('campfire',{id:'old-test',...pos,angle:95},inv,new Map(),c,{mass:300,volume:.15});
test('Materialforbruk skjer ved bygging',()=>!saved.error&&saved.inventory.stone===undefined&&saved.inventory.firewood===undefined);
const recovered=restoreSurvival(saved.error?[]:[saved.structure],c);
test('Rotasjon 95° bevares i lagringsfil',()=>recovered.structures.get('old-test')?.angle===95);
test('Gamle lagringsfiler uten småbygg støttes',()=>restoreSurvival(undefined,c).structures.size===0);
const n=checks.filter(v=>v.ok).length;document.getElementById('summary').textContent=n+' / '+checks.length+' tester bestått';document.getElementById('summary').className=n===checks.length?'good':'bad';document.getElementById('results').textContent=checks.map(v=>(v.ok?'✓ ':'✗ ')+v.name+(v.error?' – '+v.error:'')).join('\n');
</script></body></html>
