<!doctype html><html lang="no"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>AFTERFALL CE 1.1.4C.2.1 – Lagerskurtest</title><style>body{background:#10231d;color:#e7f2ea;max-width:860px;margin:auto;padding:18px;font:16px system-ui}section{background:#223c30;padding:18px;border:1px solid #87ac90;border-radius:12px}.good{color:#acebbc}.bad{color:#ffa5a5}pre{white-space:pre-wrap;font:13px/1.55 ui-monospace,monospace}a{color:#b4e8c5}</style></head><body><h1>AFTERFALL – CE 1.1.4C.2.1</h1><p>Automatiske kontroller av materiallager, volum, masse, nærliggende lagerbygninger og lagringskompatibilitet. Siden endrer ikke spillagringene.</p><section><strong id="summary">Kjører …</strong><pre id="details"></pre></section><p><a href="./?v=114c21">Åpne spillet</a></p><script type="module">
import {distanceToStorehouse,isCompletedStorehouse,storeCapacity,resourceTotals,validateStoreItems,transferToStore,restoreBuildingStores} from './construction-storage-114c0.js';
import {maxStoreTransfer,storehouseOverview,storehouseList} from './construction-storage-114c21.js';
const results=[];
const check=(name,fn)=>{try{if(!fn())throw Error('Uventet resultat');results.push({name,ok:true})}catch(e){results.push({name,ok:false,error:String(e)})}};
const catalog={logs:{name:'Tømmer',unit:'stk',mass:35,volume:.065},planks:{name:'Planker',unit:'stk',mass:6.625,volume:.012},stone:{name:'Stein',unit:'L',mass:2.65,volume:.001},battens:{name:'Lekter',unit:'stk',mass:3.0625,volume:.0055}};
const make=(id,name='Lagerskur',type='flatRoof',status='complete')=>({planId:id,status,project:{name,modules:[{type:'floorDeck'},{type:'doorWall'},{type:'doorLeaf'},{type},...Array.from({length:7},()=>({type:name==='Enkel hytte'?'windowWall':'solidWall'}))]},setout:{area:9,world:[[10,0,10],[13,0,10],[13,0,13],[10,0,13]]}});
const shed=make('shed-a'),shed2=make('shed-b'),hut=make('hut','Enkel hytte','gableRoof'),unbuilt=make('future','Lagerskur','flatRoof','building');
const limit={mass:300,volume:.15};
const max=(opts={})=>maxStoreTransfer({inventory:{logs:200},stored:{},resource:'logs',direction:'deposit',plan:shed,catalog,inventoryLimit:limit,...opts});
check('Ferdig lagerskur gjenkjennes',()=>isCompletedStorehouse(shed)&&isCompletedStorehouse(shed2));
check('Hytte regnes ikke som lager',()=>!isCompletedStorehouse(hut));
check('Uferdig lager er låst',()=>!isCompletedStorehouse(unbuilt));
check('Standard lagervolum: 12,6 m³',()=>storeCapacity(shed).volume===12.6);
check('Standard lagermasse: 14 400 kg',()=>storeCapacity(shed).mass===14400);
check('Maksinnlevering regnes mot volum',()=>max()===193);
check('Innlevering respekterer antall i inventar',()=>max({inventory:{logs:10}})===10);
check('Innlevering respekterer resterende lagerplass',()=>max({stored:{logs:192}})===1);
check('Fullt lager tillater ingen innlevering',()=>max({stored:{logs:193}})===0);
check('Uttak begrenses av inventarets volum',()=>max({inventory:{},stored:{logs:5},direction:'withdraw'})===2);
check('Uttak begrenses av faktisk lagerbeholdning',()=>max({inventory:{},stored:{logs:1},direction:'withdraw'})===1);
check('Uttak avvises når inventaret er fullt',()=>max({inventory:{planks:12},stored:{logs:5},direction:'withdraw'})===0);
check('Liter beholder tre desimaler',()=>max({inventory:{stone:3.7},resource:'stone'})===3.7);
check('Ukjent materialtype avvises',()=>max({resource:'forbidden'})===0);
check('Ugyldig overføringsretning avvises',()=>max({direction:'teleport'})===0);
check('Ugyldig overskredet lager avvises',()=>max({stored:{logs:200}})===0);
const overview=storehouseOverview({plan:shed,stored:{logs:2,stone:10},catalog});
check('Lager viser riktig samlet masse',()=>overview.mass===96.5);
check('Lager viser riktig volum',()=>Math.abs(overview.volume-.14)<1e-9);
check('Lager viser ledig kapasitet',()=>overview.volumeRemaining>12.45&&overview.volumeRemaining<12.47&&overview.massRemaining>14000);
check('Prosent og ressurstyper beregnes',()=>overview.massPercent>0&&overview.volumePercent>0&&overview.entries===2);
check('Korrupt lager blir rapportert, ikke skjult',()=>!!storehouseOverview({plan:shed,stored:{logs:200},catalog}).error);
const nearby=storehouseList(new Map([['a',shed],['b',shed2],['c',hut],['d',unbuilt]]),11,11,p=>p.planId==='shed-b'?1:2);
check('To lagerskur blir tilgjengelige',()=>nearby.length===2);
check('Nærmeste lager velges først',()=>nearby[0].plan.planId==='shed-b');
check('Hytte og uferdig lager vises ikke',()=>!nearby.some(q=>['hut','future'].includes(q.plan.planId)));
check('Lager utenfor rekkevidde kan ikke velges',()=>storehouseList(new Map([['shed',shed]]),0,0,()=>4).length===0);
const initial={planks:10},empty={};
const deposit=transferToStore({inventory:initial,stored:empty,resource:'planks',amount:3,direction:'deposit',plan:shed,catalog,inventoryLimit:limit});
check('Innlevering flytter nøyaktig riktig mengde',()=>!deposit.error&&deposit.inventory.planks===7&&deposit.stored.planks===3);
check('Innlevering endrer ikke inngangsobjektene',()=>initial.planks===10&&Object.keys(empty).length===0);
const withdrawal=transferToStore({inventory:deposit.inventory,stored:deposit.stored,resource:'planks',amount:2,direction:'withdraw',plan:shed,catalog,inventoryLimit:limit});
check('Uttak flytter nøyaktig riktig mengde',()=>!withdrawal.error&&withdrawal.inventory.planks===9&&withdrawal.stored.planks===1);
check('Total materialmengde bevares',()=>withdrawal.inventory.planks+withdrawal.stored.planks===10);
check('For stort uttak kan ikke fylle inventar over grensen',()=>!!transferToStore({inventory:{},stored:{logs:5},resource:'logs',amount:5,direction:'withdraw',plan:shed,catalog,inventoryLimit:limit}).error);
const restored=restoreBuildingStores([{planId:'shed-a',items:deposit.stored},{planId:'shed-b',items:{stone:80}}],new Map([['a',shed],['b',shed2]]),catalog);
check('To lagerskur beholder separat beholdning',()=>restored.stores.size===2&&restored.stores.get('shed-a').planks===3&&restored.stores.get('shed-b').stone===80);
check('Eldre lagring uten lagerfelt støttes',()=>restoreBuildingStores(undefined,new Map([['a',shed]]),catalog).stores.size===0);
const passed=results.filter(t=>t.ok).length;
document.getElementById('summary').textContent=passed+' / '+results.length+' tester bestått';
document.getElementById('summary').className=passed===results.length?'good':'bad';
document.getElementById('details').textContent=results.map(t=>(t.ok?'✓ ':'✗ ')+t.name+(t.error?' – '+t.error:'')).join('\n');
</script></body></html>
